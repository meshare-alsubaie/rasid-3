# تشخيص يدوي: أي المصادر تُقرأ من خوادم غيت هاب (أمريكا)؟
name: probe-sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - run: curl -s https://ipinfo.io/country; echo
      - run: uv run python scripts/check_channels.py
