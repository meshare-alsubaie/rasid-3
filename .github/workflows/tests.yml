name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7.6.0
      - run: uv sync --frozen
      - run: uv run pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test "app/**/*.test.js" "push/*.test.js"
