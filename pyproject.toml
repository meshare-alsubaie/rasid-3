[project]
name = "rasid"
version = "0.1.0"
description = "راصد ٣: رصد إعلانات التدريب التعاوني في السعودية"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "hijridate>=2.5",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["golden: اختبارات ذهبية تحتاج مفاتيح ذكاء حقيقية"]
addopts = "-m 'not golden'"

[tool.uv]
package = false
