<style>@import url("https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Readex+Pro:wght@300;400;600&display=swap");

:root {
  --night: #050a17;      /* سماء الليل */
  --deep: #0a1730;       /* عمق الأزرق */
  --ice: #8fdcff;        /* سماوي متوهج */
  --frost: #e4f1ff;      /* أبيض بارد للنص */
  --mist: #7d93b5;       /* نص ثانوي */
  --open: #5ef2c6;       /* مفتوح */
  --soon: #ffc46b;       /* يقفل قريباً */
  --warn: #ff6b7a;       /* تحذير التفرغ */
  --glass: rgba(14, 30, 58, 0.55);
  --line: rgba(143, 220, 255, 0.16);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--frost); }
body { font-family: "Readex Pro", system-ui, sans-serif; font-weight: 300; overflow: hidden; }
canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.brand {
  position: fixed; top: 22px; inset-inline-start: 28px; z-index: 3;
  font-family: "Reem Kufi", serif; font-weight: 700; font-size: 34px; letter-spacing: 0;
  color: var(--frost); text-shadow: 0 0 24px rgba(143, 220, 255, 0.45);
}
.brand small { display: block; font-family: "Readex Pro"; font-weight: 300; font-size: 13px; color: var(--mist); }

.news {
  position: fixed; top: 26px; inset-inline-end: 28px; z-index: 3; max-width: min(520px, 60vw);
  padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--glass); backdrop-filter: blur(10px); font-size: 14px; color: var(--frost);
}
.news b { color: var(--open); font-weight: 600; }

.panel {
  position: fixed; z-index: 3; inset-inline-start: 28px; bottom: 28px; width: min(380px, calc(100vw - 32px));
  display: flex; flex-direction: column; gap: 14px;
}
.panel h2 { margin: 0 0 2px; font-family: "Reem Kufi"; font-weight: 500; font-size: 18px; color: var(--mist); }

.card {
  padding: 18px 20px; border-radius: 18px; border: 1px solid var(--line);
  background: var(--glass); backdrop-filter: blur(14px);
  transition: border-color .3s, transform .3s;
}
.card:hover, .card:focus-within { border-color: rgba(143, 220, 255, 0.5); transform: translateY(-2px); }
.card .who { font-family: "Reem Kufi"; font-weight: 700; font-size: 22px; }
.card .kind { font-size: 13px; color: var(--mist); }
.card .count { margin: 12px 0 6px; font-size: 26px; font-weight: 600; color: var(--ice); }
.card .count.open { color: var(--open); }
.card .dates { font-size: 13px; color: var(--mist); line-height: 1.7; }
.card .warn { display: inline-block; margin-top: 10px; padding: 3px 10px; border-radius: 999px;
  font-size: 12px; color: var(--warn); border: 1px solid rgba(255, 107, 122, 0.4); }
.card a.apply {
  display: inline-block; margin-top: 14px; padding: 9px 16px; border-radius: 12px;
  background: var(--ice); color: var(--night); text-decoration: none; font-weight: 600; font-size: 14px;
}
.card a.apply:focus-visible { outline: 2px solid var(--frost); outline-offset: 3px; }

.tip {
  position: fixed; z-index: 4; pointer-events: none; padding: 8px 12px; border-radius: 10px;
  background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(8px);
  font-size: 14px; opacity: 0; transition: opacity .2s; white-space: nowrap;
}
.tip b { font-family: "Reem Kufi"; font-size: 17px; display: block; }
.tip.on { opacity: 1; }

.note { position: fixed; z-index: 3; bottom: 10px; inset-inline-end: 28px; font-size: 11px; color: var(--mist); opacity: .7; }

@media (max-width: 720px) {
  .brand { top: 14px; inset-inline-start: 16px; font-size: 26px; }
  .news { top: auto; bottom: calc(100% - 64px); inset-inline-end: 16px; font-size: 12px; max-width: 55vw; }
  .panel { inset-inline-start: 16px; bottom: 16px; width: calc(100vw - 32px); max-height: 46vh; overflow: auto; }
  .note { display: none; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }

<body>

<script type="module">
const {byId, programsByEntity, reducedMotion, status, renderChrome, showTip, hideTip, tint} = (() => {
// الأجزاء المشتركة بين النماذج الثلاثة: الشريط، البطاقات، العدّ التنازلي، التلميح.
const D = window.RASID;
const TODAY = new Date(D.today + "T00:00:00");
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const KIND = { coop: "تدريب تعاوني", university: "تدريب جامعي", hint: "تلميح لبرنامج قادم" };
const byId = Object.fromEntries(D.entities.map(e => [e.id, e]));
const programsByEntity = Object.fromEntries(D.programs.map(p => [p.entity, p]));
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function days(n) {
  if (n === 1) return "يوم واحد";
  if (n === 2) return "يومين";
  return n <= 10 ? `${n} أيام` : `${n} يوماً`;
}
function fmt(iso) { const d = new Date(iso + "T00:00:00"); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function diff(iso) { return Math.round((new Date(iso + "T00:00:00") - TODAY) / 86400000); }

function status(p) {
  if (!p) return "none";
  if (p.closes && diff(p.closes) < 0) return "closed";
  if (p.opens && diff(p.opens) > 0) return "upcoming";
  if (p.closes && diff(p.closes) <= 3) return "soon";
  return p.opens || p.closes ? "open" : "listed";
}

function countdown(p) {
  if (p.opens && diff(p.opens) > 0) return { text: `يفتح بعد ${days(diff(p.opens))}`, cls: "" };
  if (p.closes) return { text: diff(p.closes) === 0 ? "آخر يوم اليوم" : `باقي ${days(diff(p.closes))}`, cls: "open" };
  return { text: "صفحة البرنامج متاحة", cls: "" };
}

function renderChrome() {
  const live = D.programs.filter(p => status(p) !== "closed");
  document.body.insertAdjacentHTML("beforeend", `
    <div class="brand">راصد<small>التدريب التعاوني، من مصدره</small></div>
    <div class="news" role="status"><b>جديد منذ آخر زيارة:</b> أرامكو أعلنت التدريب الجامعي، والتسجيل ${fmt("2026-10-26")}</div>
    <section class="panel" aria-label="الفرص القادمة والمفتوحة">
      <h2>القادم والمفتوح</h2>
      ${live.map(p => {
        const e = byId[p.entity], c = countdown(p);
        return `<article class="card" data-entity="${e.id}">
          <div class="who">${e.name}</div>
          <div class="kind">${KIND[p.kind] || ""}${p.title ? "، " + p.title : ""}</div>
          <div class="count ${c.cls}">${c.text}</div>
          ${p.opens ? `<div class="dates">التسجيل من ${fmt(p.opens)} إلى ${fmt(p.closes)}</div>` : ""}
          ${p.no_courses ? `<span class="warn">تشترط التفرّغ: لا مواد أثناء التدريب</span>` : ""}
          <div><a class="apply" href="${p.apply}" target="_blank" rel="noopener">قدّم من الموقع الرسمي</a></div>
        </article>`;
      }).join("")}
    </section>
    <div class="tip" aria-hidden="true"></div>
    <div class="note">نموذج للتصميم ببيانات حقيقية. أشهر الفتح على الرسم تقريبية حتى يكتمل سجل السنوات.</div>`);
}

const tip = () => document.querySelector(".tip");
function showTip(entity, x, y) {
  const t = tip(), p = programsByEntity[entity.id];
  const st = { open: "مفتوح الآن", upcoming: "أعلن وقريباً يفتح", soon: "يقفل قريباً", listed: "صفحة البرنامج متاحة" }[status(p)] || "لم يعلن بعد";
  t.innerHTML = `<b>${entity.name}</b>${"★".repeat(entity.stars)}${"☆".repeat(5 - entity.stars)}، ${st}`;
  t.style.left = Math.min(x + 14, innerWidth - t.offsetWidth - 10) + "px";
  t.style.top = (y + 14) + "px";
  t.classList.add("on");
}
function hideTip() { tip().classList.remove("on"); }

// لون خفيف لكل جهة حسب طابعها (اللمسة الخفيفة)
function tint(id) {
  if (["aramco", "sasref", "samref", "yasref", "satorp", "luberef", "sabic", "maaden"].includes(id)) return [0.37, 0.95, 0.78];
  if (["sdaia", "nca", "ncac", "site", "elm", "dga", "ncai", "ncdc"].includes(id)) return [0.62, 0.62, 1.0];
  return [0.56, 0.86, 1.0];
}

return {byId, programsByEntity, reducedMotion, status, renderChrome, showTip, hideTip, tint};
})();
renderChrome();

// النموذج الثاني «مدار السنة»: السنة مدار، والأشهر حوله، وكل جهة على شهر فتحها المعتاد،
// ومؤشر «اليوم» يمشي ببطء. التصميم نفسه يقول لك مين يفتح بعدك.
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const today = new Date(window.RASID.today + "T00:00:00");
const yearFrac = (today - new Date(today.getFullYear(), 0, 1)) / 31536000000;
const c = document.getElementById("scene"), x = c.getContext("2d");
let W, H, cx, cy, R, dpr, tilt = 0.42, rot = 0, mouse = { x: 0.5, y: 0.5 };
const ents = window.RASID.entities;
const placed = [], unknown = [];
ents.forEach((e, i) => (e.months.length ? e.months.forEach(m => placed.push({ e, m, j: i })) : unknown.push({ e, j: i })));

// غبار المدار: جسيمات تجري على الحلقات
const dust = Array.from({ length: 900 }, () => ({ a: Math.random() * 6.283, r: 0.55 + Math.random() * 0.62, s: 0.0004 + Math.random() * 0.0012, z: Math.random() }));
const stars = Array.from({ length: 260 }, () => ({ x: Math.random(), y: Math.random(), z: Math.random() }));

function resize() {
  dpr = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight;
  c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const wide = W > 720;
  cx = wide ? W * 0.40 : W * 0.5; cy = wide ? H * 0.52 : H * 0.33; R = Math.min(wide ? W * 0.3 : W * 0.33, H * 0.62);
  const hub = document.querySelector(".hub"); hub.style.left = cx + "px"; hub.style.top = cy + "px";
}
addEventListener("resize", resize); resize();

const angleOf = f => -Math.PI / 2 + f * Math.PI * 2 + rot;
const pt = (a, r) => [cx + Math.cos(a) * R * r, cy + Math.sin(a) * R * r * tilt];
function ringR(stars) { return stars >= 5 ? 0.72 : stars === 4 ? 0.86 : 1.0; }

// المحور: أقرب فتح قادم
const nextP = window.RASID.programs.filter(p => p.opens && new Date(p.opens) >= today).sort((a, b) => a.opens.localeCompare(b.opens))[0];
document.querySelector(".hub .when").textContent = `${today.getDate()} ${MONTHS[today.getMonth()]}`;
if (nextP) {
  const d = Math.round((new Date(nextP.opens + "T00:00:00") - today) / 86400000);
  document.querySelector(".hub .next").innerHTML = `أقرب فتح: <b>${byId[nextP.entity].name}</b> بعد ${d} يوماً`;
}

let hits = [];
function draw(t) {
  x.clearRect(0, 0, W, H);
  // سماء
  for (const s of stars) {
    x.globalAlpha = 0.25 + 0.5 * s.z * (reducedMotion ? 1 : 0.6 + 0.4 * Math.sin(t / 1400 + s.x * 40));
    x.fillStyle = "#cfe6ff"; x.fillRect(s.x * W + (mouse.x - 0.5) * 12 * s.z, s.y * H + (mouse.y - 0.5) * 12 * s.z, 1.2, 1.2);
  }

  // الحلقات الثلاث (الأقرب = نجوم أكثر)
  for (const r of [0.72, 0.86, 1.0]) {
    x.beginPath(); x.ellipse(cx, cy, R * r, R * r * tilt, 0, 0, Math.PI * 2);

  }
  // الغبار يجري على المدار
  for (const d of dust) {
    if (!reducedMotion) d.a += d.s;
    const [px, py] = pt(d.a + rot, d.r);
    const front = Math.sin(d.a + rot) > 0;
    x.globalAlpha = (front ? 0.55 : 0.22) * d.z; x.fillStyle = "#8fdcff"; x.fillRect(px, py, 1.4, 1.4);
  }

  // أسماء الأشهر
  x.font = `500 ${W > 720 ? 15 : 12}px "Reem Kufi"`; x.textAlign = "center"; x.textBaseline = "middle";

    const [px, py] = pt(angleOf((i + 0.5) / 12), 1.17);
    x.fillStyle = i === today.getMonth() ? "#e4f1ff" : "rgba(125,147,181,0.85)"; x.fillText(m, px, py);
  });
  // مؤشر اليوم
  const ta = angleOf(yearFrac), [tx, ty] = pt(ta, 1.06);
  const pulse = reducedMotion ? 1 : 0.6 + 0.4 * Math.sin(t / 700);
  const grd = x.createLinearGradient(cx, cy, tx, ty);
  grd.addColorStop(0, "rgba(143,220,255,0)"); grd.addColorStop(1, `rgba(143,220,255,${0.75 * pulse})`);
  x.strokeStyle = grd; x.lineWidth = 2; x.beginPath(); x.moveTo(cx, cy); x.lineTo(tx, ty); x.stroke();
  x.fillStyle = "#e4f1ff"; x.beginPath(); x.arc(tx, ty, 4, 0, 7); x.fill();
  // الجهات على أشهرها
  hits = [];
  placed.forEach(({ e, m, j }) => {
    const jitter = ((j * 37) % 11 - 5) / 220;
    const [px, py] = pt(angleOf((m - 0.5) / 12 + jitter), ringR(e.stars));
    const st = status(programsByEntity[e.id]);
    const live = st === "upcoming" || st === "open";
    const [r, g, b] = live ? [0.37, 0.95, 0.78] : tint(e.id);
    const rad = 2.5 + e.stars * 0.9 + (live ? 2 * pulse : 0);
    const glow = x.createRadialGradient(px, py, 0, px, py, rad * 4);

    x.fillStyle = glow; x.beginPath(); x.arc(px, py, rad * 4, 0, 7); x.fill();
    x.fillStyle = `rgb(${r * 255},${g * 255},${b * 255})`; x.beginPath(); x.arc(px, py, rad, 0, 7); x.fill();
    hits.push({ e, px, py, rad: rad + 6 });

    const a = j * 2.399 + t * (reducedMotion ? 0 : 0.00002), rr = 1.3 + ((j * 13) % 10) / 40;

addEventListener("pointermove", ev => {
  mouse.x = ev.clientX / W; mouse.y = ev.clientY / H;
  const h = hits.find(h => Math.hypot(h.px - ev.clientX, h.py - ev.clientY) < h.rad);
  if (h) { showTip(h.e, ev.clientX, ev.clientY); c.style.cursor = "pointer"; } else { hideTip(); c.style.cursor = ""; }
});
let running = true;
document.addEventListener("visibilitychange", () => { running = !document.hidden; if (running) requestAnimationFrame(loop); });
function loop(t) {
  if (!running) return;
  tilt += ((0.36 + mouse.y * 0.14) - tilt) * 0.05;
  rot += ((mouse.x - 0.5) * 0.25 - rot) * 0.04;
  draw(t || 0);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
